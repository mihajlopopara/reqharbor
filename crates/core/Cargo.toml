[package]
name = "reqharbor-core"
description = "ReqHarbor core: data model, HTTP execution, cURL/OpenAPI import, storage, sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "fs", "io-util", "net"] }
tokio-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ulid = "3"
base64 = "0.23"
percent-encoding = "2"
url = "2"
flate2 = "1"
brotli-decompressor = "6"
serde_yaml_ng = "0.10"
quick-xml = "0.42"
# Dynamic variables ({{$uuid}}, {{$randomEmail}}, …); both already in Cargo.lock.
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
# PKCE (SHA-256) and CSPRNG for sign-in; already compiled through rustls.
ring = "0.17"
# Unicode general category for device names (the server accepts only
# \p{L}\p{N}); already compiled through url/idna.
icu_properties = "2"
# WebSocket requests (ws.rs). TLS is done here with tokio-rustls (ring, like
# reqwest) and rustls-platform-verifier (the roots reqwest uses), so
# tungstenite needs no TLS feature of its own.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# gRPC requests (grpc.rs): tonic's HTTP/2 client over our own TCP / tokio-rustls
# connector (no tonic TLS feature, so rustls stays on ring with the platform
# verifier and verifyTls: false works), dynamic messages with prost-reflect
# (proto3 JSON mapping via its serde feature), .proto files compiled in-process
# with protox (no protoc), and the reflection client from tonic-reflection.
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14"
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = { version = "0.10", default-features = false }
# Locations of protox errors ("file.proto:12:5: …"); already a protox dependency.
miette = { version = "7", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
http = "1"

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
rcgen = "0.14"
# Checks device names against the server's exact `\p{L}\p{N}` pattern.
regex = "1"
# grpc tests run an in-process tonic server with reflection.
tonic = { version = "0.14", default-features = false, features = ["server", "router", "channel", "codegen", "tls-connect-info"] }
bytes = "1"
tonic-reflection = { version = "0.14", default-features = true }
