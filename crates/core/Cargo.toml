[package]
name = "reqharbor-core"
description = "ReqHarbor core: data model, HTTP execution, cURL/OpenAPI import, storage, sync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "fs", "io-util"] }
tokio-util.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
ulid = "3"
base64 = "0.23"
percent-encoding = "2"
url = "2"
flate2 = "1"
brotli-decompressor = "6"
serde_yaml_ng = "0.10"
quick-xml = "0.42"

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = "0.14"
