[package]
name = "reqharbor-app"
description = "ReqHarbor desktop HTTP client (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reqharbor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqharbor-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
# Sign-in opens the system browser (04 §2.4); called from Rust only.
tauri-plugin-opener = "2"
# Session tokens in the OS keychain (AC-AUTH-7). Linux uses the zbus-based
# Secret Service (no libdbus), with its own async-io executor.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "async-io", "crypto-rust"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile = "3"
# graphql_rt tests run a tiny HTTP server.
tokio = { workspace = true, features = ["net", "io-util", "rt", "macros", "time"] }
