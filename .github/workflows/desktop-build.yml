name: Desktop build

# Builds the Tauri desktop app for Windows, macOS (Apple Silicon + Intel) and Linux.
# - push / PR / manual run: bundles are uploaded as workflow artifacts
# - push of a tag v* (e.g. v0.1.0): bundles + SHA256SUMS.txt are published as a
#   GitHub Release. The tag must match "version" in src-tauri/tauri.conf.json.
# macOS builds are ad-hoc signed; there is no Apple notarization or Windows
# code-signing yet (no certificates configured), see README "Install".

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only by the release step on tags

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04 # older glibc => AppImage/deb run on more distros
            target: x86_64-unknown-linux-gnu
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v${app_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${app_version}"
            exit 1
          fi

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev build-essential file patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install UI dependencies
        run: npm ci --prefix ui

      # Run the Tauri CLI from the repo root so it finds src-tauri/; its
      # beforeBuildCommand builds the UI (npm run build in ui/).
      - name: Build app bundles
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }}

      - name: Upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: reqharbor-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Artifacts keep their bundle/<kind>/ subfolders; flatten them so the
      # release gets the installer files themselves.
      - name: Collect installers and write checksums
        run: |
          mkdir release
          find dist -type f -exec mv -n {} release/ \;
          cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          name: ReqHarbor ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## Download

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `ReqHarbor_*_aarch64.dmg` |
            | macOS (Intel) | `ReqHarbor_*_x64.dmg` |
            | Windows | `ReqHarbor_*_x64-setup.exe` or `ReqHarbor_*_x64_en-US.msi` |
            | Linux | `ReqHarbor_*_amd64.AppImage`, `.deb` or `.rpm` |

            The apps are not notarized/code-signed yet. First launch:
            - **macOS:** if "ReqHarbor is damaged" or "cannot be opened" appears, run `xattr -dr com.apple.quarantine /Applications/ReqHarbor.app`, or allow it in System Settings → Privacy & Security.
            - **Windows:** on the SmartScreen prompt choose "More info" → "Run anyway".
            - **Linux AppImage:** `chmod +x ReqHarbor_*.AppImage` then run it.

            Verify downloads against `SHA256SUMS.txt`.
          fail_on_unmatched_files: true
          files: release/*
