[workspace]
resolver = "3"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }

# Release builds are tuned for installer size (PRODUCT §7: .dmg <= 12 MB).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Tauri's recommended size setting. reqharbor-core never panics on user input
# (parsers return Result; covered by proptest), so aborting is acceptable.
panic = "abort"

# Keep debug builds lean on disk: line tables only.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
