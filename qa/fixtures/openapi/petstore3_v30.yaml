# Modelled on https://petstore3.swagger.io/api/v3/openapi.json (Swagger Petstore - OpenAPI 3.0, v1.0.x)
openapi: 3.0.4
info:
  title: Swagger Petstore - OpenAPI 3.0
  description: This is a sample Pet Store Server based on the OpenAPI 3.0 specification.
  termsOfService: http://swagger.io/terms/
  contact: { email: apiteam@swagger.io }
  license: { name: Apache 2.0, url: http://www.apache.org/licenses/LICENSE-2.0.html }
  version: 1.0.26
externalDocs: { description: Find out more about Swagger, url: http://swagger.io }
servers:
  - url: /api/v3
tags:
  - name: pet
    description: Everything about your Pets
  - name: store
    description: Access to Petstore orders
  - name: user
    description: Operations about user
paths:
  /pet:
    put:
      tags: [pet]
      summary: Update an existing pet.
      operationId: updatePet
      requestBody:
        description: Update an existent pet in the store
        content:
          application/json: { schema: { $ref: '#/components/schemas/Pet' } }
          application/xml: { schema: { $ref: '#/components/schemas/Pet' } }
          application/x-www-form-urlencoded: { schema: { $ref: '#/components/schemas/Pet' } }
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json: { schema: { $ref: '#/components/schemas/Pet' } }
        '400': { description: Invalid ID supplied }
      security:
        - petstore_auth: ['write:pets', 'read:pets']
    post:
      tags: [pet]
      summary: Add a new pet to the store.
      operationId: addPet
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/Pet' } }
          application/xml: { schema: { $ref: '#/components/schemas/Pet' } }
        required: true
      responses:
        200: { description: Successful operation }
  /pet/findByStatus:
    get:
      tags: [pet]
      summary: Finds Pets by status.
      operationId: findPetsByStatus
      parameters:
        - name: status
          in: query
          description: Status values that need to be considered for filter
          required: false
          explode: true
          schema: { type: string, default: available, enum: [available, pending, sold] }
      responses:
        '200': { description: successful operation }
  /pet/findByTags:
    get:
      tags: [pet]
      summary: Finds Pets by tags.
      operationId: findPetsByTags
      parameters:
        - name: tags
          in: query
          required: false
          explode: true
          schema: { type: array, items: { type: string } }
      responses:
        '200': { description: successful operation }
  /pet/{petId}:
    get:
      tags: [pet]
      summary: Find pet by ID.
      operationId: getPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200': { description: successful operation }
      security:
        - api_key: []
        - petstore_auth: ['write:pets', 'read:pets']
    post:
      tags: [pet]
      summary: Updates a pet in the store with form data.
      operationId: updatePetWithForm
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: name, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
      responses:
        '200': { description: successful operation }
    delete:
      tags: [pet]
      summary: Deletes a pet.
      operationId: deletePet
      parameters:
        - { name: api_key, in: header, required: false, schema: { type: string } }
        - { name: petId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Pet deleted }
  /pet/{petId}/uploadImage:
    post:
      tags: [pet]
      summary: Uploads an image.
      operationId: uploadFile
      parameters:
        - { name: petId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: additionalMetadata, in: query, required: false, schema: { type: string } }
      requestBody:
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        '200': { description: successful operation }
  /store/inventory:
    get:
      tags: [store]
      summary: Returns pet inventories by status.
      operationId: getInventory
      responses:
        '200': { description: successful operation }
      security:
        - api_key: []
  /store/order:
    post:
      tags: [store]
      summary: Place an order for a pet.
      operationId: placeOrder
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/Order' } }
      responses:
        '200': { description: successful operation }
  /store/order/{orderId}:
    get:
      tags: [store]
      summary: Find purchase order by ID.
      operationId: getOrderById
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: ok } }
    delete:
      tags: [store]
      summary: Delete purchase order by identifier.
      operationId: deleteOrder
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses: { '200': { description: ok } }
  /user:
    post:
      tags: [user]
      summary: Create user.
      operationId: createUser
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/User' } }
      responses: { default: { description: ok } }
  /user/createWithList:
    post:
      tags: [user]
      summary: Creates list of users with given input array.
      operationId: createUsersWithListInput
      requestBody:
        content:
          application/json:
            schema: { type: array, items: { $ref: '#/components/schemas/User' } }
      responses: { '200': { description: ok } }
  /user/login:
    get:
      tags: [user]
      summary: Logs user into the system.
      operationId: loginUser
      parameters:
        - { name: username, in: query, required: false, schema: { type: string } }
        - { name: password, in: query, required: false, schema: { type: string } }
      responses: { '200': { description: ok } }
  /user/logout:
    get:
      tags: [user]
      summary: Logs out current logged in user session.
      operationId: logoutUser
      parameters: []
      responses: { '200': { description: ok } }
  /user/{username}:
    get:
      tags: [user]
      summary: Get user by user name.
      operationId: getUserByName
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
    put:
      tags: [user]
      summary: Update user resource.
      operationId: updateUser
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json: { schema: { $ref: '#/components/schemas/User' } }
      responses: { '200': { description: ok } }
    delete:
      tags: [user]
      summary: Delete user resource.
      operationId: deleteUser
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: ok } }
components:
  schemas:
    Order:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        petId: { type: integer, format: int64, example: 198772 }
        quantity: { type: integer, format: int32, example: 7 }
        shipDate: { type: string, format: date-time }
        status: { type: string, description: Order Status, example: approved, enum: [placed, approved, delivered] }
        complete: { type: boolean }
      xml: { name: order }
    Category:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Dogs }
    User:
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        username: { type: string, example: theUser }
        firstName: { type: string, example: John }
        lastName: { type: string, example: James }
        email: { type: string, example: john@email.com }
        password: { type: string, example: '12345' }
        phone: { type: string, example: '12345' }
        userStatus: { type: integer, description: User Status, format: int32, example: 1 }
    Tag:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    Pet:
      required: [name, photoUrls]
      type: object
      properties:
        id: { type: integer, format: int64, example: 10 }
        name: { type: string, example: doggie }
        category: { $ref: '#/components/schemas/Category' }
        photoUrls:
          type: array
          xml: { wrapped: true }
          items: { type: string, xml: { name: photoUrl } }
        tags:
          type: array
          xml: { wrapped: true }
          items: { $ref: '#/components/schemas/Tag' }
        status: { type: string, description: pet status in the store, enum: [available, pending, sold] }
  securitySchemes:
    petstore_auth:
      type: oauth2
      flows:
        implicit:
          authorizationUrl: https://petstore3.swagger.io/oauth/authorize
          scopes: { 'write:pets': modify pets in your account, 'read:pets': read your pets }
    api_key:
      type: apiKey
      name: api_key
      in: header
